spring.application.name=taskmaster

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.default-schema=dbo

logging.level.org.hibernate.SQL=WARN


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION_MS}
jwt.cookie.secure=true
frontend.url=${FE_URL}

spring.security.user.name=${SPRING_SECURIT_USER}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.open-in-view=false



logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

